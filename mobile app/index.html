<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080F16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Sage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080F16; --s1:#0E1720; --s2:#14202C; --s3:#1B2A38;
  --line:rgba(216,179,106,.13); --line2:rgba(232,238,244,.11);
  --ink:#E8EEF4; --ink2:#A6B4C2; --ink3:#6E7F8F;
  --gold:#D8B36A; --gold2:#B9944F;
  --ok:#5E9A72; --no:#B85C4A;
  --d:"Cormorant Garamond",serif;
  --f:"IBM Plex Sans Arabic",-apple-system,system-ui,sans-serif;
  --nav:66px; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:300;
  line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:.7rem .85rem;width:100%}
input:focus{outline:none;border-color:var(--gold2)}
:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
::selection{background:rgba(216,179,106,.22)}
i{font-style:normal}
b{font-weight:500}

.top{display:flex;align-items:center;gap:.65rem;padding:calc(.9rem + env(safe-area-inset-top)) 1.1rem .8rem;
  position:sticky;top:0;background:linear-gradient(var(--bg) 68%,transparent);z-index:20}
.top img{width:30px;height:30px;border-radius:9px;flex:none}
.top h1{font-family:var(--d);font-size:1.6rem;font-weight:600;line-height:1}
.top span{font-size:.66rem;color:var(--gold);letter-spacing:.16em;margin-inline-start:auto}

main{padding:0 1.1rem 3rem;max-width:860px;margin:0 auto}
.hd{padding:1.5rem 0 1.1rem}
.eyebrow{font-size:.74rem;color:var(--gold);letter-spacing:.1em;margin-bottom:.45rem}
h2.title{font-family:var(--d);font-size:clamp(2rem,8vw,2.9rem);font-weight:500;line-height:1.15;margin-bottom:.55rem}
html[lang="ar"] h2.title{font-family:var(--f);font-weight:400;font-size:clamp(1.6rem,6.5vw,2.3rem)}
.lede{font-size:.93rem;color:var(--ink2);line-height:1.95;max-width:60ch}
.sec{font-size:.8rem;font-weight:500;color:var(--gold);letter-spacing:.05em;
  margin:2rem 0 .7rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}

.hero{background:linear-gradient(160deg,var(--s2),var(--s1) 60%,var(--bg));
  border:1px solid var(--line);border-radius:var(--r);padding:.4rem 1.1rem 1.1rem;margin-bottom:1.2rem;
  position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 78% -18%,rgba(216,179,106,.14),transparent 62%)}
.hero>*{position:relative}

.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.gauge{background:rgba(232,238,244,.04);border:1px solid var(--line2);border-radius:11px;
  padding:.75rem .55rem;text-align:center}
.gauge b{display:block;font-family:var(--d);font-size:1.7rem;font-weight:600;color:var(--gold);line-height:1}
html[lang="ar"] .gauge b{font-family:var(--f);font-weight:500;font-size:1.5rem}
.gauge b i{font-size:.55em;color:var(--ink3);font-weight:300}
.gauge span{display:block;font-size:.68rem;color:var(--ink3);margin-top:.35rem;line-height:1.4}

.notice{display:flex;align-items:center;gap:.7rem;background:var(--s1);border:1px solid var(--line);
  border-radius:11px;padding:.7rem .9rem;margin-bottom:.8rem;font-size:.85rem;color:var(--ink2)}
.notice.good{border-color:rgba(94,154,114,.3)}
.notice button{color:var(--gold);font-size:.83rem;margin-inline-start:auto;white-space:nowrap}

.rows{display:flex;flex-direction:column;gap:.4rem}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:.6rem;align-items:start;
  background:var(--s1);border:1px solid transparent;border-radius:12px;padding:.8rem .85rem}
.row .tm{font-size:.76rem;color:var(--ink3);padding-top:.2rem;white-space:nowrap}
.row .rn{font-size:.98rem;line-height:1.45;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.row .mins{font-size:.7rem;color:var(--ink3)}
.row .rh{font-size:.79rem;color:var(--ink3);line-height:1.6;margin-top:.1rem}
.row.fixed{background:transparent;border-color:var(--line2);opacity:.65}
.row.past{opacity:.45}
.row.done .rn{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.row.next{background:linear-gradient(140deg,rgba(216,179,106,.12),var(--s2));border-color:rgba(216,179,106,.34)}
.row .ra{display:flex;gap:.4rem;align-items:center}
.act{font-size:.75rem;border:1px solid var(--line2);border-radius:8px;padding:.3rem .6rem;color:var(--ink2)}
.tick{width:34px;height:34px;border:1px solid var(--line2);border-radius:9px;display:grid;place-items:center;flex:none}
.tick svg{width:14px;height:14px;stroke:var(--ink3);stroke-width:2.4;fill:none;opacity:.4}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on svg{stroke:#0A130E;opacity:1}
.pip{background:var(--gold);color:#0B1219;font-size:.66rem;font-weight:600;
  border-radius:20px;padding:0 .4rem;min-width:1.15rem;text-align:center;line-height:1.35}
.whyb{font-size:.74rem;color:var(--gold);margin-top:.4rem;
  border-bottom:1px solid rgba(216,179,106,.3);padding-bottom:1px}

.why{border-inline-start:2px solid var(--gold2);padding-inline-start:.85rem;margin:.85rem 0 .2rem}
.wrow{margin-bottom:.7rem}
.wl{display:block;font-size:.68rem;color:var(--gold);letter-spacing:.08em;margin-bottom:.1rem}
.why p{font-size:.85rem;color:var(--ink2);line-height:1.95}
.wref{font-size:.73rem;color:var(--ink3);border-top:1px solid var(--line2);padding-top:.45rem}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.fields label,.inl{font-size:.79rem;color:var(--ink3);display:flex;flex-direction:column;gap:.3rem}
.ev,.pr,.ci,.st{display:flex;align-items:center;gap:.7rem;background:var(--s1);
  border:1px solid var(--line2);border-radius:11px;padding:.7rem .85rem;margin-bottom:.4rem}
.ev>div,.pr>div,.ci>div{flex:1;min-width:0}
.ev b,.pr b,.ci b,.st b{font-size:.94rem;display:block}
.st b{flex:1}
.ev span,.pr span,.ci span{font-size:.76rem;color:var(--ink3);display:block}
.del{font-size:.76rem;color:var(--no);white-space:nowrap}
.none{font-size:.86rem;color:var(--ink3);padding:.7rem 0}
.addbox{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);
  padding:.9rem;display:grid;gap:.55rem;margin-top:.6rem}
.addbox .two{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.days{display:flex;gap:.25rem;flex-wrap:wrap}
.dbtn{font-size:.74rem;border:1px solid var(--line2);border-radius:8px;padding:.32rem .5rem;color:var(--ink3)}
.dbtn.on{background:var(--gold);border-color:var(--gold);color:#0B1219;font-weight:500}
.pri{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#0B1219;
  font-weight:500;border-radius:10px;padding:.7rem 1.3rem;font-size:.9rem}
.wide{width:100%}
.big-cta{margin:1rem 0;padding:.9rem;font-size:.95rem}
.dngr{border:1px solid var(--no);color:var(--no);border-radius:10px;padding:.6rem 1.2rem;font-size:.86rem}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{font-size:.79rem;border:1px solid var(--line2);border-radius:8px;padding:.34rem .7rem;color:var(--ink)}
.chip.off{color:var(--ink3);opacity:.45;text-decoration:line-through}
.hint{font-size:.76rem;color:var(--ink3);margin-top:.5rem}
.notify{display:grid;gap:.5rem;margin-top:.4rem}
.nb{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);padding:1rem}
.nb b{font-size:.95rem;display:block;margin-bottom:.3rem}
.nb p{font-size:.82rem;color:var(--ink3);line-height:1.8;margin-bottom:.7rem}
.nb button:not(.pri):not(.dngr){border:1px solid var(--line2);border-radius:9px;
  padding:.5rem 1rem;font-size:.84rem;color:var(--ink2)}
.filebtn{display:inline-block;border:1px solid var(--line2);border-radius:9px;padding:.5rem 1rem;
  font-size:.84rem;color:var(--ink2);cursor:pointer;margin-inline-start:.4rem}
.filebtn input{display:none}
.impmsg{font-size:.8rem;margin-top:.6rem;min-height:1.2em}
.impmsg.ok{color:var(--ok)} .impmsg.no{color:var(--no)}
.ok{color:var(--ok)} .no{color:var(--no)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem}
.wd{background:var(--s1);border:1px solid var(--line2);border-radius:9px;padding:.55rem .2rem;text-align:center}
.wd span{display:block;font-size:.62rem;color:var(--ink3)}
.wd b{font-size:1.05rem;color:var(--gold);font-weight:500}

.cards{display:grid;gap:.6rem}
.card{background:linear-gradient(150deg,var(--s2),var(--s1));border:1px solid var(--line2);
  border-radius:var(--r);padding:1.1rem}
.card .dom{font-size:.7rem;color:var(--gold);letter-spacing:.07em;margin-bottom:.15rem}
.card h3{font-size:1.14rem;font-weight:500;margin-bottom:.3rem}
.card p{font-size:.85rem;color:var(--ink2);line-height:1.8}
.cmeta{display:flex;align-items:baseline;gap:.5rem;margin-top:.9rem}
.bg{font-family:var(--d);font-size:1.6rem;font-weight:600;color:var(--gold);line-height:1}
html[lang="ar"] .bg{font-family:var(--f);font-weight:500;font-size:1.4rem}
.bl{font-size:.74rem;color:var(--ink3)}
.crow{display:flex;gap:.5rem;margin-top:.9rem}
.crow button:not(.pri){border:1px solid var(--line2);border-radius:10px;
  padding:.7rem 1rem;font-size:.85rem;color:var(--ink2)}

.bigchart{background:linear-gradient(150deg,var(--s2),var(--s1));border:1px solid var(--line);
  border-radius:var(--r);padding:1.1rem;margin-bottom:.8rem}
.bch{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.9rem;flex-wrap:wrap}
.bch b{font-size:1.02rem}
.chg{font-size:.8rem;color:var(--ink3);margin-inline-start:auto}
.chg.up,.chg.ok{color:var(--ok)} .chg.no{color:var(--no)}
.bigchart svg{width:100%;height:110px;overflow:visible}
.bcf{display:flex;gap:1.6rem;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--line2)}
.bcf b{display:block;font-family:var(--d);font-size:1.5rem;font-weight:600;color:var(--gold);line-height:1}
html[lang="ar"] .bcf b{font-family:var(--f);font-weight:500;font-size:1.3rem}
.bcf span{font-size:.7rem;color:var(--ink3)}
.table{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.tr{display:grid;grid-template-columns:1fr auto 3.4rem;gap:.8rem;padding:.75rem .95rem;
  border-bottom:1px solid var(--line2);align-items:center}
.tr:last-child{border-bottom:none}
.tn{font-size:.9rem} .tc{font-size:.83rem;color:var(--ink3)}
.tc.up{color:var(--ok)} .tc.dn{color:var(--no)}
.tv{font-size:1.05rem;color:var(--gold);text-align:end;font-weight:500}

.calbars{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;height:120px;align-items:end}
.cb{position:relative;height:100%;display:flex;align-items:flex-end;gap:3px}
.cb i{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.cb .conf{background:rgba(216,179,106,.35)}
.cb .acc{background:var(--gold)}
.cb .none2{flex:1;background:var(--line2);height:3px}
.cb span{position:absolute;bottom:-1.3rem;inset-inline:0;text-align:center;font-size:.64rem;color:var(--ink3)}
.callegend{display:flex;gap:1rem;margin-top:1.8rem;font-size:.72rem;color:var(--ink3)}
.callegend span::before{content:'';display:inline-block;width:.6rem;height:.6rem;
  border-radius:2px;margin-inline-end:.35rem}
.callegend .k1::before{background:rgba(216,179,106,.35)}
.callegend .k2::before{background:var(--gold)}

.pr.due{border-color:rgba(216,179,106,.35)}
.pr .pra{display:flex;gap:.4rem;flex:none}
.pra button{border:1px solid var(--line2);border-radius:9px;padding:.4rem .8rem;font-size:.8rem}
.pra .yes{color:var(--ok);border-color:rgba(94,154,114,.4)}
.pra .no2{color:var(--no);border-color:rgba(184,92,74,.4)}
.pr.res{opacity:.75}
.pr.hit{border-inline-start:2px solid var(--ok)}
.pr.miss{border-inline-start:2px solid var(--no)}
.conf.pick{display:flex;gap:.3rem;flex-wrap:wrap}
.conf.pick button{border:1px solid var(--line2);border-radius:8px;padding:.4rem .7rem;
  font-size:.84rem;color:var(--ink3)}
.conf.pick button.on{background:var(--gold);border-color:var(--gold);color:#0B1219;font-weight:500}

.clist,.stations{display:flex;flex-direction:column}
.ci .cd{font-size:.73rem;color:var(--gold);white-space:nowrap;flex:none}
.st .sn{width:1.6rem;font-size:.8rem;color:var(--gold);flex:none}
.mv{font-size:.95rem;color:var(--ink3);padding:0 .3rem;flex:none}

.menu{display:flex;flex-direction:column;gap:.4rem}
.mi{display:flex;align-items:center;gap:.6rem;background:var(--s1);border:1px solid var(--line2);
  border-radius:12px;padding:.95rem 1rem;text-align:start;width:100%}
.mi b{font-size:.98rem;font-weight:400;flex:1}
.chev{width:18px;height:18px;stroke:var(--ink3);stroke-width:1.6;fill:none;flex:none}

.mod{border-bottom:1px solid var(--line2)}
.mod summary{list-style:none;cursor:pointer;padding:1.2rem 0;display:grid;
  grid-template-columns:1fr auto;gap:1rem;align-items:start}
.mod summary::-webkit-details-marker{display:none}
.mod h3{font-size:1.12rem;font-weight:500;line-height:1.35}
.mod .one{font-size:.85rem;color:var(--ink2);margin-top:.25rem}
.mod .ev{border:1px solid var(--line2);border-radius:6px;font-size:.68rem;color:var(--ink3);
  padding:.1rem .45rem;white-space:nowrap;display:block;margin:0}
.mod .ev.hi{color:var(--gold);border-color:rgba(216,179,106,.35)}
.mod .body{padding-bottom:1.6rem;max-width:70ch}
.mod .body h4{font-size:.82rem;font-weight:500;color:var(--gold);margin:1.4rem 0 .5rem}
.mod .body p{font-size:.9rem;color:var(--ink2);line-height:2;margin-bottom:.7rem}
.mod .body ol{padding-inline-start:1.2rem;margin:.3rem 0}
.mod .body li{font-size:.89rem;color:var(--ink2);line-height:1.95;margin-bottom:.4rem}
.mod .body li::marker{color:var(--gold2)}
.refs{margin-top:1.2rem;padding-top:.8rem;border-top:1px solid var(--line2)}
.refs div{font-size:.77rem;color:var(--ink3);line-height:1.85}

.limit{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);
  padding:1.1rem;margin-bottom:.6rem;border-inline-start:2px solid var(--no)}
.limit h3{font-size:1.04rem;font-weight:500;margin-bottom:.4rem}
.limit p{font-size:.88rem;color:var(--ink2);line-height:1.95}
.limit .yes{background:rgba(94,154,114,.09);border-radius:10px;padding:.65rem .8rem;
  margin-top:.8rem;font-size:.86rem;color:var(--ink2);line-height:1.85}
.limit .yes span{color:var(--ok);font-weight:500;margin-inline-end:.4rem}
.closing{background:linear-gradient(150deg,var(--s2),var(--s1));border:1px solid var(--line);
  border-radius:var(--r);padding:1.2rem;margin-top:1rem;font-size:.92rem;color:var(--ink2);line-height:2}
.closing b{color:var(--gold);font-weight:500}
.empty{background:var(--s1);border:1px dashed var(--line2);border-radius:var(--r);
  padding:1.4rem;color:var(--ink2);font-size:.89rem;line-height:1.95}

nav#nav{position:fixed;bottom:0;inset-inline:0;height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(10,17,24,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
nav#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.2rem;color:var(--ink3);font-size:.66rem;padding-top:.2rem}
nav#nav svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
nav#nav button[aria-current="true"]{color:var(--gold)}

.stage{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;
  padding:calc(.9rem + env(safe-area-inset-top)) 1.1rem calc(1rem + env(safe-area-inset-bottom))}
.stage.open{display:flex}
.sh{display:flex;align-items:center;gap:.8rem;border-bottom:1px solid var(--line2);padding-bottom:.8rem}
.sh h3{font-size:1.05rem;font-weight:500}
.sh .lvl{font-size:.78rem;color:var(--gold)}
.sh button{margin-inline-start:auto;font-size:1rem;color:var(--ink3)}
.arena{flex:1;display:grid;place-items:center;text-align:center;overflow-y:auto;padding:1rem 0}
.arena .inner{width:100%;max-width:520px}
.cue{font-size:.89rem;color:var(--ink2);line-height:1.95;margin-bottom:1.4rem}
.cue b{color:var(--ink)} .gold{color:var(--gold)}
.sm2{font-size:.79rem;color:var(--ink3)}
.big{font-family:var(--d);font-size:clamp(3rem,17vw,5.5rem);font-weight:500;line-height:1.15;min-height:1.2em}
html[lang="ar"] .big{font-family:var(--f);font-weight:300}
.big i{font-size:.3em;color:var(--ink3)}
.big.sm{font-size:clamp(1.2rem,5.5vw,1.8rem);line-height:1.7;font-weight:400}
.entry{max-width:380px;margin:1.2rem auto 0;text-align:center;border-radius:10px}
.got{font-size:.95rem;color:var(--ok);min-height:2.2em;margin-top:.8rem;line-height:1.8}
.acts{display:flex;gap:.5rem;justify-content:center;margin-top:1.6rem;flex-wrap:wrap}
.acts button:not(.pri){border:1px solid var(--line2);border-radius:10px;
  padding:.65rem 1.3rem;font-size:.87rem;color:var(--ink2)}
.opts{display:grid;gap:.5rem;max-width:380px;margin:1.2rem auto 0}
.opts.two2{grid-template-columns:1fr 1fr} .opts.four{grid-template-columns:1fr 1fr}
.opts button{background:var(--s2);border:1px solid var(--line2);border-radius:11px;
  padding:.85rem 1rem;font-size:.95rem;color:var(--ink)}
.conf{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap}
.conf button{border:1px solid var(--line2);border-radius:9px;padding:.5rem .8rem;font-size:.86rem;color:var(--ink2)}
.verdict{font-size:.98rem;margin-top:1.1rem;line-height:1.85}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:290px;margin:1.4rem auto 0}
.keypad button{background:var(--s2);border:1px solid var(--line2);border-radius:12px;
  padding:.85rem 0;font-size:1.3rem;font-weight:300}
.keypad button:active{background:var(--s3)}
.keypad .alt{font-size:1.1rem;color:var(--ink3)}
.keypad .ok2{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#0B1219;border-color:transparent}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:1.6rem}
.grades button{border:1px solid var(--line2);border-radius:10px;padding:.7rem .3rem;
  font-size:.82rem;color:var(--ink2)}
.grades .g0{color:var(--no);border-color:rgba(184,92,74,.35)}
.grades .g3{color:var(--ok);border-color:rgba(94,154,114,.35)}
.swatches{display:flex;gap:1.1rem;justify-content:center;margin:1rem 0}
.swatches button{width:min(38vw,120px);height:min(38vw,120px);border-radius:14px;border:1px solid var(--line2)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,78px));gap:6px;justify-content:center;margin:1rem auto}

 mech:{ar:'التعلّم الإدراكي بيغيّر معالجة الإشارة في القشرة الحسية نفسها. الشرط: تعرّض متكرّر بارتجاع فوري وفرق بيضيق تدريجيًا.',
 en:'Perceptual learning changes signal processing in sensory cortex itself. The requirement is repeated exposure with immediate feedback and a gap that narrows.'},
 study:{ar:'موثّق عبر مجالات كتير: أخصائيو الأشعة، الذوّاقة، مراقبو الطيران. والتصوير الدماغي بيوري تغيّر في الاستجابة الحسية نفسها مش في مناطق القرار بس.',
 en:'Documented across radiologists, tasters and air traffic controllers. Imaging shows change in the sensory response itself, not only in decision regions.'},
 ref:'Goldstone — Perceptual Learning, Annual Review of Psychology'},
light:{does:{ar:'بيضبط ساعتك البيولوجية، فبتنعس في ميعاد وتصحى بطاقة. أقوى مفتاح تحكّم في طاقتك، ومجاني.',
 en:'Sets your body clock, so you get sleepy on time and wake with energy. The strongest lever you have over your energy, and it is free.'},
 mech:{ar:'في شبكيتك مستقبلات بتقيس شدة الضوء وبتبعت لساعة الجسم. النور بدري بيقدّم إفراز الميلاتونين بالليل بساعات.',
 en:'Receptors in your retina measure light intensity and signal the body clock. Early light advances melatonin release at night by hours.'},
 study:{ar:'نور النهار حتى في يوم غايم أقوى بمرات كتير من أي إضاءة داخلية. الفرق أكبر من إن العين تحسّه، بس الساعة البيولوجية بتحسّه.',
 en:'Daylight even on an overcast day is many times stronger than indoor lighting. The gap is larger than the eye registers, but the clock registers it.'},
 ref:'Circadian entrainment literature'},
breath:{does:{ar:'بيهدّي جسمك بالإرادة في دقيقتين. أسرع أداة عندك وقت توتر حاد.',
 en:'Calms your body on demand in two minutes. The fastest tool you have in acute stress.'},
 mech:{ar:'الزفير الطويل بينشّط العصب الحائر فبيبطّئ النبض مباشرة. آلية فسيولوجية مقاسة، مش تشبيه.',
 en:'A long exhale engages the vagus nerve and slows heart rate directly. A measured physiological mechanism, not a metaphor.'},
 study:{ar:'التنفس البطيء (٥–٦ نفس في الدقيقة) بيرفع تغيّر معدل ضربات القلب — مؤشر على مرونة الجهاز العصبي اللاإرادي.',
 en:'Slow breathing (5–6 breaths per minute) raises heart rate variability — a marker of autonomic flexibility.'},
 ref:'Slow-breathing and HRV reviews'},
move:{does:{ar:'أقوى تدخّل مثبت على الوظائف التنفيذية والمزاج. أقوى من أي تمرين ذهني.',
 en:'The strongest proven intervention on executive function and mood. Stronger than any mental exercise.'},
 mech:{ar:'بيرفع عامل نمو عصبي (BDNF) بيدعم تكوين وصلات جديدة، وبيزوّد التروية الدموية للمخ.',
 en:'Raises BDNF, a growth factor supporting new connections, and increases cerebral blood flow.'},
 study:{ar:'٦ شهور مشي هوائي منتظم زوّدت حجم الحُصين — منطقة الذاكرة — بينما مجموعة المقارنة استمرت في الانكماش الطبيعي.',
 en:'Six months of regular aerobic walking increased hippocampal volume — the memory region — while the control group continued its normal decline.'},
 ref:'Erickson et al. 2011 — PNAS'},
deep:{does:{ar:'الحاجة الوحيدة اللي بتنتج شغل صعب. وأي مقاطعة بتكلّف أكتر بكتير من وقتها.',
 en:'The only thing that produces hard work. Any interruption costs far more than the time it takes.'},
 mech:{ar:'المخ مش بيوازي، بيبدّل، وكل تبديل ليه تكلفة. وبتفضل بقايا انتباه معلّقة على المهمة السابقة فبتشتغل بجزء من طاقتك.',
 en:'The brain does not parallelise, it switches, and every switch costs. Attention residue stays attached to the previous task, so you work at a fraction of capacity.'},
 study:{ar:'تجربة على مئات المشاركين لقت إن مجرد وجود التليفون على الترابيزة — مقلوب ومسكوت — قلّل الأداء في الذاكرة العاملة. الحل المثبت الوحيد: أوضة تانية.',
 en:'A study of hundreds of participants found the mere presence of a phone on the desk — face down, silenced — reduced working memory performance. The only proven fix is another room.'},
 ref:'Ward et al. 2017 · Leroy — attention residue'},
med:{does:{ar:'بيدرّبك تلاحظ فكرتك من برّه بدل ما تكون جوّاها. ودي اللي بتكسر الاجترار — إنك تفضل تلف حوالين نفس السؤال.',
 en:'Trains you to notice a thought from outside instead of being inside it. That is what breaks rumination — circling the same question without noticing.'},
 mech:{ar:'الرجوع المتكرّر من الشرود للنَّفَس هو التمرين نفسه، مش الوصول لصفاء. كل رجعة بمثابة تكرار.',
 en:'Returning from distraction to the breath is the exercise itself, not reaching some clear state. Each return is one repetition.'},
 study:{ar:'مراجعة منهجية لأكتر من ٤٧ تجربة عشوائية لقت أثرًا متوسطًا على القلق والاكتئاب والألم. متوسط — يعني حقيقي ومش خارق.',
 en:'A systematic review of over 47 randomised trials found a moderate effect on anxiety, depression and pain. Moderate — meaning real, not miraculous.'},
 ref:'Goyal et al. 2014 — JAMA Internal Medicine'},
plan:{does:{ar:'بيفصل اللي في إيدك عن اللي مش في إيدك، فبتحط طاقتك على اللي بيتحرّك.',
 en:'Separates what is in your hands from what is not, so your energy goes where it moves something.'},
 mech:{ar:'القلق بيشتغل على تهديدات مفيش فيها فعل ممكن. الكتابة بتحوّل الغامض لمحدّد، والمحدّد بيصغّر.',
 en:'Anxiety runs on threats with no available action. Writing turns vague into specific, and specific shrinks.'},
 study:{ar:'«هحاول أتمرّن أكتر» أثرها شبه صفر. «لو بقت الساعة ٧، هلبس وأنزل أمشي» أثرها مقاس وقوي — لأنك بتنقل القرار من لحظة الضعف لوقت الصفاء.',
 en:'"I will try to exercise more" has near-zero effect. "If it is 7am, I will put on shoes and walk" has a large measured effect — you move the decision out of the weak moment.'},
 ref:'Gollwitzer — implementation intentions'},
review:{does:{ar:'بيقفل حلقة التعلّم. إنت مش بتتعلّم من التجربة — بتتعلّم من مراجعتها.',
 en:'Closes the learning loop. You do not learn from experience — you learn from reviewing it.'},
 mech:{ar:'الكتابة بتحوّل اليوم من كتلة مبهمة لسرد ليه بداية ونهاية، والمخ بيرتاح للمقفول أكتر من المفتوح.',
 en:'Writing turns the day from a vague mass into a narrative with a start and an end, and the mind settles on closed things far better than open ones.'},
 study:{ar:'الكتابة عن تجربة مشحونة بتقلل أثرها بمرور الوقت. الشرط: تكتب الفعل مش الشخص — «أجّلت الشغل» مش «أنا فاشل».',
 en:'Writing about a charged experience reduces its weight over time. The condition: write the action, not the person — "I postponed the work", not "I am a failure".'},
 ref:'Pennebaker — expressive writing'},
pause:{does:{ar:'بيرجّع انتباهك. الراحة المجدولة أنفع من الراحة عند الإحساس بالتعب.',
 en:'Restores attention. Scheduled rest beats rest taken when you feel tired.'},
 mech:{ar:'الانتباه بينضب، والإحساس بالتعب بييجي متأخر عن الانخفاض الفعلي في الأداء.',
 en:'Attention depletes, and the feeling of fatigue arrives well after performance has already dropped.'},
 study:{ar:'الحلول اللي بتيجي فجأة في المشي بتحصل عشان بطّلت تضغط. السكرول مش راحة — هو تغيير نوع المدخلات بس.',
 en:'Solutions that arrive on a walk arrive because you stopped pushing. Scrolling is not rest — it only changes the type of input.'},
 ref:'Attention restoration literature'},
sleep:{does:{ar:'التثبيت الفعلي لكل اللي اتعلمته بيحصل هنا. النوم جزء من التعلّم مش راحة بعده.',
 en:'Consolidation of everything you learned happens here. Sleep is part of learning, not a rest after it.'},
 mech:{ar:'أثناء النوم العميق بيتم نقل الذكريات من التخزين المؤقت للتخزين طويل المدى، وبيحصل تنضيف أيضي للمخ.',
 en:'During deep sleep memories move from temporary to long-term storage and metabolic clearance takes place.'},
 study:{ar:'المذاكرة من غير نوم كافي بعدها = خسارة معظم اللي ذاكرته. وقلة النوم بتضرب الحكم — والأخطر إنك بتفقد القدرة على تقدير إنك تعبان.',
 en:'Studying without sufficient sleep afterwards loses most of it. Sleep loss degrades judgement — and worse, removes your ability to tell that it has.'},
 ref:'Diekelmann & Born — Nature Reviews Neuroscience'},
cards:{does:{ar:'بتخلّي اللي اتعلّمته يفضل. المراجعة الموزّعة هي التدخّل الوحيد اللي بيكسر منحنى النسيان.',
 en:'Makes what you learned stay. Spaced review is the only intervention that bends the forgetting curve.'},
 mech:{ar:'الاسترجاع بجهد بيثبّت أقوى من إعادة القراءة بمراحل. والمراجعة وقت ما تكون على وشك تنسى هي أقوى نقطة.',
 en:'Effortful retrieval consolidates far more than rereading. Reviewing at the point where you are about to forget is the strongest moment.'},
 study:{ar:'إيبنجهاوس قاس نسيان نفسه سنة ١٨٨٥ ولقى إن معظم اللي اتعلمته بيضيع في الساعات الأولى. ومراجعة ٢٠١٣ لعشر تقنيات مذاكرة حطّت الاسترجاع والتوزيع في القمة وحدهم.',
 en:'Ebbinghaus measured his own forgetting in 1885 and found most of what he learned gone within hours. A 2013 review of ten study techniques placed retrieval and spacing alone at the top.'},
 ref:'Dunlosky et al. 2013 · Bjork — desirable difficulties'}
};

{ev:4,t:{ar:'الترميز — أصل الحفظ كله',en:'Encoding — the root of all memory'},

      en:'Memory is not a fixed capacity. It is an encoding skill, and the gap between ordinary and extraordinary is method, not hardware.'},
 body:[
 {h:{ar:'الاكتشاف',en:'The finding'},p:{ar:'باحثان بدأوا سنة ١٩٧٨ يدرّبوا طالب عادي على استرجاع أرقام. بدأ عند ٧ — المدى الطبيعي. بعد أكتر من ٢٠٠ ساعة تدريب موزّعة على شهور، وصل <b>٧٩ رقمًا</b>. ولمّا جرّبوه على حروف بدل أرقام، رجع لـ٦.',
   en:'In 1978 two researchers began training an ordinary student on digit recall. He started at 7 — the normal span. After more than 200 hours spread over months he reached <b>79 digits</b>. Tested on letters instead, he dropped back to 6.'}},
 {h:{ar:'اللي ده معناه',en:'What that means'},p:{ar:'قدرته الخام ما اتغيرتش. اللي اتغيّر إنه بنى نظام ترميز: كان عدّاء، فحوّل كل ٣–٤ أرقام لزمن سباق يعرفه. يعني <b>ربط الجديد بمعرفة قديمة عميقة</b> — وده الميكانيزم الوحيد اللي بيشتغل في كل تقنيات الحفظ.',
   en:'His raw capacity never moved. What changed is that he built an encoding system: he was a runner, so every 3–4 digits became a race time he knew. <b>Binding the new to deep existing knowledge</b> — the only mechanism at work in every memory technique.'}},
 {h:{ar:'التطبيق',en:'Practice'},ol:[
  {ar:'<b>قصر الذاكرة</b>: مكان تعرفه بالتفصيل، ١٠ محطات بترتيب ثابت، وكل عنصر في محطة بصورة مبالغة ومتحركة.',
   en:'<b>Memory palace</b>: a place you know in detail, ten stations in fixed order, each item placed as an exaggerated moving image.'},
  {ar:'<b>النظام الكبير</b>: كل رقم ليه صوت ساكن (١=ت، ٢=ن، ٣=م…). تحوّل الأرقام لكلمات، والكلمات لصور.',
   en:'<b>The major system</b>: each digit maps to a consonant sound. Digits become words, words become images.'},
  {ar:'<b>شخص–فعل–شيء</b>: كل رقمين بيبقوا شخص أو فعل أو شيء. تركّبهم في مشهد فتخزّن ٦ أرقام في صورة واحدة.',
   en:'<b>Person–action–object</b>: each pair of digits becomes a person, an action or an object. Combined into one scene, six digits fit in a single image.'},
  {ar:'المبالغة والحركة والغرابة بتتحفظ أحسن من المألوف. ده مش ذوق — ده اللي بيشتغل.',
   en:'Exaggeration, motion and strangeness encode better than the ordinary. That is not taste, it is what works.'}]},
 {h:{ar:'المصادر',en:'Sources'},refs:['Ericsson, Chase & Faloon 1980 — Science','Ericsson & Pool — Peak (2016)','Joshua Foer — Moonwalking with Einstein','Frances Yates — The Art of Memory']}]},

{ev:4,t:{ar:'التوزيع — إزاي ما تنساش',en:'Spacing — how not to forget'},
 one:{ar:'منحنى النسيان معروف من ١٨٨٥. والمراجعة الموزّعة هي التدخّل الوحيد اللي بيكسره.',
      en:'The forgetting curve has been known since 1885. Spaced review is the only intervention that bends it.'},
 body:[
 {h:{ar:'المشكلة',en:'The problem'},p:{ar:'إيبنجهاوس قاس نسيان نفسه سنة ١٨٨٥ ولقى إن معظم اللي اتعلمته بيضيع في الساعات الأولى. الجلسة الطويلة الواحدة بتدّي إحساس قوي بالإتقان وبتضيع بسرعة.',
   en:'Ebbinghaus measured his own forgetting in 1885 and found most of what he learned gone within hours. One long session produces a strong feeling of mastery and disappears fast.'}},
 {h:{ar:'الحل',en:'The fix'},p:{ar:'ذاكر نفس المادة على فترات متباعدة بدل جلسة مجمّعة. <b>وراجع وقت ما تكون على وشك تنسى</b> — الجهد في الاسترجاع هو اللي بيثبّت، مش سهولته.',
   en:'Study the same material at widening intervals instead of massing it. <b>Review at the point you are about to forget</b> — the effort of retrieval consolidates, not its ease.'}},
 {h:{ar:'الجدول',en:'The schedule'},ol:[
  {ar:'المراجعة الأولى بعد يوم',en:'First review after one day'},
  {ar:'التانية بعد ٣ أيام',en:'Second after three days'},
  {ar:'التالتة بعد أسبوع',en:'Third after a week'},
  {ar:'الرابعة بعد أسبوعين، والخامسة بعد شهر — وبعدها بتبقى شبه دايمة',en:'Fourth after two weeks, fifth after a month — after that it is close to permanent'},
  {ar:'كل مراجعة تكون <b>باسترجاع</b>: اقفل المصدر واكتب، وبعدين صحّح. القراءة تاني مش مراجعة.',
   en:'Every review is <b>retrieval</b>: close the source, produce it, then check. Rereading is not review.'}]},
 {h:{ar:'صعوبات مرغوبة',en:'Desirable difficulties'},p:{ar:'اللي بيخلّي التعلّم يبان أصعب وقتها — التوزيع، والتبديل بين الأنواع، والاسترجاع — بيدّي احتفاظ أطول. <b>الإحساس بالسهولة أثناء المذاكرة علامة سيئة.</b>',
   en:'What makes learning feel harder in the moment — spacing, interleaving, retrieval — produces longer retention. <b>Ease during study is a bad sign.</b>'}},
 {h:{ar:'المصادر',en:'Sources'},refs:['Dunlosky et al. 2013 — Psych Science in the Public Interest','Bjork — desirable difficulties','Brown, Roediger & McDaniel — Make It Stick']}]},

{ev:4,t:{ar:'الممارسة المتعمَّدة',en:'Deliberate practice'},
 one:{ar:'مش عدد الساعات. اللي بيفرّق هو نوع الساعة — والفرق بين ٢٠ سنة خبرة وسنة مكرّرة ٢٠ مرة.',
      en:'Not the number of hours. What separates people is the kind of hour — the difference between twenty years of experience and one year repeated twenty times.'},
 body:[
 {h:{ar:'الشروط الأربعة',en:'The four conditions'},ol:[
  {ar:'<b>هدف محدد جدًا</b> — «هظبّط النقلة دي» مش «هتمرّن».',en:'<b>A very specific target</b> — "fix this transition", not "practise".'},
  {ar:'<b>خارج منطقة راحتك</b> — عند الحافّة اللي بتفشل فيها أحيانًا. اللي بتعمله كويس مش بيعلّمك.',en:'<b>Outside comfort</b> — at the edge where you sometimes fail. What you already do well teaches you nothing.'},
  {ar:'<b>ارتجاع فوري</b> — تعرف غلطت في نفس اللحظة. من غيره التكرار بيثبّت الغلط.',en:'<b>Immediate feedback</b> — you know you were wrong in the moment. Without it repetition cements the error.'},
  {ar:'<b>تكرار مع تعديل</b> — مش إعادة، تصحيح.',en:'<b>Repetition with correction</b> — not replay, revision.'}]},
 {h:{ar:'ليه معظم الناس بتقف',en:'Why most people plateau'},p:{ar:'الأداء بيوصل لمستوى «كفاية»، وبعدها بيبقى تلقائي، والتلقائي مابيتحسنش. الاستمرار في التحسّن معناه <b>إنك ترجع الحاجة للوعي عمدًا</b> وتشتغل على جزء منها.',
   en:'Performance reaches "good enough", then becomes automatic, and automatic does not improve. Continuing to improve means <b>deliberately returning the skill to conscious control</b> and working one part of it.'}},
 {h:{ar:'المصادر',en:'Sources'},refs:['Ericsson & Pool — Peak','Ericsson et al. 1993 — the violinist study','Note: the "10,000 hours" rule is a journalistic simplification Ericsson himself rejected']}]},

{ev:4,t:{ar:'المعايرة — تدريب الحكم',en:'Calibration — training judgement'},
 one:{ar:'أهم مهارة عقلية مالهاش اسم دارج: إن ثقتك تطابق دقّتك. وهي بتتدرّب بفروق مقاسة.',
      en:'The most important mental skill without a common name: making your confidence match your accuracy. It trains, with measurable gains.'},
 body:[
 {h:{ar:'المشروع',en:'The project'},p:{ar:'مشروع بحثي كبير بدأ ٢٠١١ خلّى آلاف المتطوعين يتنبأوا بأحداث عالمية باحتمالات رقمية. طلعت مجموعة صغيرة بتتفوّق على المتوسط بفارق كبير ومستمر — وسبقت محللين عندهم وصول لمعلومات سرّية.',
   en:'A large research project starting in 2011 had thousands of volunteers forecast world events as numeric probabilities. A small group beat the average by a wide and persistent margin — and outperformed analysts with classified access.'}},
 {h:{ar:'اللي كانوا بيعملوه',en:'What they did'},ol:[
  {ar:'<b>يبدأوا من النسبة الأساسية</b> — كام مرة الحاجة دي بتحصل عمومًا؟ قبل أي تفصيل.',en:'<b>Start from the base rate</b> — how often does this happen generally? Before any detail.'},
  {ar:'<b>يفكّكوا السؤال</b> لأجزاء أصغر تقدر تقدّرها.',en:'<b>Break the question</b> into smaller parts you can estimate.'},
  {ar:'<b>يعدّلوا بخطوات صغيرة</b> مع كل معلومة جديدة، مش قفزات.',en:'<b>Update in small steps</b> with each new piece, not leaps.'},
  {ar:'<b>يشوفوا الحاجة من برّه</b> — الحالات المشابهة عملت إيه؟ قبل تفاصيل حالتك.',en:'<b>Take the outside view</b> — what did similar cases do? Before your own specifics.'},
  {ar:'<b>يسجّلوا ويحسبوا</b> — من غير سجل مفيش تحسّن.',en:'<b>Record and score</b> — without a record there is no improvement.'}]},
 {h:{ar:'المصادر',en:'Sources'},refs:['Tetlock & Gardner — Superforecasting','Kahneman — Thinking, Fast and Slow']}]},

{ev:4,t:{ar:'التعلّم الإدراكي',en:'Perceptual learning'},
 one:{ar:'حواسك نفسها بتتحسّن بالتدريب. الخبير مش بيفسّر أحسن — هو <b>بيشوف</b> حاجات إنت مش شايفها.',
      en:'Your senses themselves improve with training. The expert does not interpret better — they <b>see</b> what you cannot.'},
 body:[
 {h:{ar:'الظاهرة',en:'The phenomenon'},p:{ar:'أخصائي أشعة بيشوف ورم في صورة إنت شايفها رمادي في رمادي. ذوّاق بيميّز فروق إنت مش حاسّها. ده مش تفسير أفضل — التمييز الحسي نفسه اتغيّر بالتدريب، وده موثّق في التصوير الدماغي.',
   en:'A radiologist sees a tumour in an image you read as grey on grey. A taster distinguishes what you cannot detect. This is not better interpretation — sensory discrimination itself changed, and imaging documents it.'}},
 {h:{ar:'إزاي بيحصل',en:'How it happens'},ol:[
  {ar:'<b>تعرّض كتيف مع ارتجاع فوري</b> — تخمّن، وتعرف الإجابة فورًا.',en:'<b>Dense exposure with immediate feedback</b> — guess, then know at once.'},
  {ar:'<b>مقارنة جنب بعض</b> — أسهل بكتير من الحكم المنفرد. ابدأ بيها.',en:'<b>Side-by-side comparison</b> — far easier than isolated judgement. Start there.'},
  {ar:'<b>ضيّق الفرق تدريجيًا</b> — كل ما تتقن مستوى، قرّب الفرق.',en:'<b>Narrow the gap gradually</b> — each mastered level, bring them closer.'},
  {ar:'<b>سمّي اللي بتحسّه</b> — التسمية بتثبّت التمييز.',en:'<b>Name what you notice</b> — labelling stabilises the distinction.'}]},
 {h:{ar:'المصادر',en:'Sources'},refs:['Goldstone — Perceptual Learning, Annual Review of Psychology','Kellman & Garrigan — perceptual learning and expertise']}]},

{ev:3,t:{ar:'الكبح وضبط النفس',en:'Inhibition and self-control'},
 one:{ar:'القدرة تمنع الاستجابة التلقائية. والحقيقة إنها بتتحسّن بالتصميم أكتر من بالعزيمة.',
      en:'The ability to stop an automatic response. In practice it improves through design far more than through willpower.'},
 body:[
 {h:{ar:'اللي بيشتغل',en:'What works'},ol:[
  {ar:'<b>نوايا التنفيذ</b>: «لو حصل [موقف محدد]، هعمل [فعل محدد]». الأثر مقاس وقوي.',en:'<b>Implementation intentions</b>: "if [specific situation], I will [specific action]". The effect is measured and large.'},
  {ar:'<b>الالتزام المسبق</b>: تشيل الخيار قبل ما تحتاج تقاومه. التليفون في أوضة تانية بيغلب أي عزيمة.',en:'<b>Precommitment</b>: remove the option before you must resist it. A phone in another room beats any resolve.'},
  {ar:'<b>تصميم البيئة</b>: خلّي المرغوب سهل والمرفوض صعب. كل احتكاك بيفرق.',en:'<b>Environment design</b>: make the wanted easy and the unwanted hard. Every unit of friction counts.'}]},
 {h:{ar:'ملاحظة على «نفاد الإرادة»',en:'A note on "ego depletion"'},p:{ar:'فكرة إن ضبط النفس مورد بينضب زي عضلة — اتشككت فيها بشدة. تجارب إعادة كبيرة ما لقتش الأثر. <b>حطّيتها هنا عشان تعرف إنها متنازع عليها، مش عشان تبني عليها.</b>',
   en:'The idea that self-control is a resource that depletes like a muscle has been heavily challenged. Large replication attempts failed to find the effect. <b>It is here so you know it is disputed, not so you build on it.</b>'}},
 {h:{ar:'المصادر',en:'Sources'},refs:['Gollwitzer — implementation intentions','Hagger et al. 2016 — failed replication of ego depletion']}]},

{ev:4,t:{ar:'الجسم كأداة معرفية',en:'The body as cognitive equipment'},
 one:{ar:'أقوى تدخّل مثبت على الوظائف التنفيذية مش تمرين ذهني — هو المجهود البدني والنوم.',
      en:'The strongest proven intervention on executive function is not a mental exercise — it is physical effort and sleep.'},
 body:[
 {h:{ar:'المجهود',en:'Effort'},p:{ar:'دراسة مضبوطة لقت إن ٦ شهور مشي هوائي منتظم زوّدت <b>حجم الحُصين</b> — منطقة الذاكرة — بينما مجموعة المقارنة استمرت في الانكماش الطبيعي.',
   en:'A controlled study found six months of regular aerobic walking increased <b>hippocampal volume</b> — the memory region — while controls continued their normal decline.'}},
 {h:{ar:'النوم',en:'Sleep'},p:{ar:'تثبيت الذاكرة بيحصل في النوم. المذاكرة من غير نوم كافي بعدها = خسارة معظم اللي ذاكرته. <b>النوم جزء من عملية التعلّم مش راحة بعدها.</b>',
   en:'Consolidation happens during sleep. Studying without adequate sleep afterwards loses most of it. <b>Sleep is part of learning, not a rest that follows it.</b>'}},
 {h:{ar:'التعلّم الحركي المركّب',en:'Complex motor learning'},p:{ar:'الرياضات والآلات اللي بتتطلب تنسيق وتوقيت وتكيّف مستمر بتدرّب أنظمة مشتركة مع الوظائف التنفيذية. تعلّم آلة موسيقية أو رياضة جديدة أنفع معرفيًا من أي لعبة على تليفون.',
   en:'Sports and instruments demanding coordination, timing and constant adaptation train systems shared with executive function. Learning an instrument or a new sport does more cognitively than any phone game.'}},
 {h:{ar:'المصادر',en:'Sources'},refs:['Erickson et al. 2011 — PNAS','Diekelmann & Born — Nature Reviews Neuroscience','Walker — Why We Sleep']}]},

{ev:3,t:{ar:'نماذج التفكير',en:'Thinking models'},
 one:{ar:'مش كل غلطة نقص معلومات. كتير منها أنماط متكرّرة ليها أسماء — واللي يعرف اسمها يلمحها.',
      en:'Not every error is missing information. Many are recurring patterns with names — and naming them lets you catch them.'},
 body:[
 {h:{ar:'أهمها عمليًا',en:'The ones that matter'},ol:[
  {ar:'<b>إهمال النسبة الأساسية</b>: بتحكم من التفاصيل وتنسى كام مرة ده بيحصل أصلًا.',en:'<b>Base rate neglect</b>: judging from detail while forgetting how often the thing happens at all.'},
  {ar:'<b>التأكيد</b>: بتدوّر على اللي بيأيّدك. العلاج: اكتب إيه اللي يخلّيك تغيّر رأيك — <em>قبل</em> ما تبحث.',en:'<b>Confirmation</b>: you search for what agrees. The fix: write what would change your mind — <em>before</em> you look.'},
  {ar:'<b>الإتاحة</b>: بتقدّر الاحتمال بسهولة تذكّر مثال.',en:'<b>Availability</b>: you estimate probability by how easily an example comes to mind.'},
  {ar:'<b>التثبيت</b>: أول رقم تشوفه بيسحب تقديرك. في التفاوض، مين بيبدأ بيكسب.',en:'<b>Anchoring</b>: the first number drags your estimate. In negotiation, whoever opens gains.'},
  {ar:'<b>ناجون فقط</b>: بتدرس الناجحين وتنسى إن الفاشلين عملوا نفس الحاجة.',en:'<b>Survivorship</b>: you study winners and forget the losers did the same things.'},
  {ar:'<b>التكلفة الغارقة</b>: بتكمّل عشان دفعت، مش عشان مفيد.',en:'<b>Sunk cost</b>: you continue because you paid, not because it helps.'}]},
 {h:{ar:'أنفع أداة',en:'The most useful tool'},p:{ar:'<b>التشريح المسبق</b>: قبل ما تبدأ مشروع، تخيّل إنه فشل خلاص، واكتب ليه. بيكشف مخاطر التفاؤل بيخفيها — وأسهل بكتير من إنك تسأل «إيه اللي ممكن يغلط».',
   en:'<b>The pre-mortem</b>: before starting, imagine the project has already failed and write why. It surfaces risks optimism hides, and is far easier than asking "what could go wrong".'}},
 {h:{ar:'المصادر',en:'Sources'},refs:['Kahneman — Thinking, Fast and Slow','Klein — the pre-mortem technique']}]},

{ev:4,t:{ar:'الانتباه',en:'Attention'},
 one:{ar:'مورد محدود، والمقاطعة بتكلّف أكتر بكتير من وقتها.',
      en:'A limited resource, and interruption costs far more than the time it takes.'},
 body:[
 {h:{ar:'التكلفة الحقيقية',en:'The real cost'},p:{ar:'المخ مش بيوازي — بيبدّل، وكل تبديل ليه ثمن. وبيفضل <b>بقايا انتباه</b> معلّقة على المهمة السابقة، فبتشتغل بجزء من طاقتك من غير ما تحس.',
   en:'The brain does not parallelise — it switches, and each switch costs. <b>Attention residue</b> stays attached to the previous task, so you work at a fraction of capacity without noticing.'}},
 {h:{ar:'التليفون',en:'The phone'},p:{ar:'تجربة على مئات المشاركين لقت إن مجرد وجود التليفون على الترابيزة — مقلوب ومسكوت — قلّل الأداء في اختبارات الذاكرة العاملة. <b>الحل الوحيد المثبت: أوضة تانية.</b>',
   en:'A study of hundreds found that a phone merely present on the desk — face down, silent — reduced working memory performance. <b>The only proven fix is another room.</b>'}},
 {h:{ar:'البروتوكول',en:'Protocol'},ol:[
  {ar:'بلوك ٩٠ دقيقة، حاجة واحدة محدّدة بالاسم',en:'A 90-minute block, one thing named in advance'},
  {ar:'صفر إشعارات، والتليفون بره',en:'Zero notifications, phone out of the room'},
  {ar:'وقفة ١٠ دقايق بالساعة — الإحساس بالتعب بييجي متأخر عن انخفاض الأداء',en:'A 10-minute break by the clock — fatigue is felt long after performance drops'},
  {ar:'بلوكين كتير، تلاتة ممتاز. حد أقصى مش هدف',en:'Two blocks is plenty, three is excellent. A ceiling, not a target'}]},
 {h:{ar:'المصادر',en:'Sources'},refs:['Ward et al. 2017 — Journal of the ACR','Leroy — attention residue','Newport — Deep Work']}]}
];

const LIMITS=[
{t:{ar:'الذكاء العام مابيترفعش بالتمارين',en:'General intelligence does not rise from training'},
 p:{ar:'أكبر دراسة على ألعاب تدريب المخ (١١ ألف مشارك، منشورة في Nature) لقت تحسّنًا في التمارين المتدرَّب عليها بس، من غير انتقال لقدرات عامة. ومراجعة موسّعة ٢٠١٦ خلصت لنفس النتيجة.',
    en:'The largest brain-training study (11,000 participants, published in Nature) found improvement only on the trained tasks, with no transfer to general ability. A broad 2016 review reached the same conclusion.'},
 yes:{ar:'اللي بيترفع فعلًا: مهارات محددة، ومعرفة منظّمة، واستراتيجيات ترميز. ودي بتدّي فروق أكبر بكتير من أي مكسب مزعوم في الذكاء العام.',
      en:'What does rise: specific skills, organised knowledge, and encoding strategies. These produce far larger differences than any claimed gain in general intelligence.'},
 ref:'Owen et al. 2010 — Nature · Simons et al. 2016'},
{t:{ar:'الرجوع خطوة موجود بتحفّظ',en:'N-back is included with a caveat'},
 p:{ar:'دراسة ٢٠٠٨ ادّعت إنه بيرفع الذكاء السائل واتبنى عليها مجال تجاري كامل. التحليلات البعدية اللاحقة لقت الانتقال ضعيف جدًا أو معدوم.',
    en:'A 2008 study claimed it raised fluid intelligence and an entire commercial field was built on it. Later meta-analyses found transfer very weak or absent.'},
 yes:{ar:'موجود كتدريب انتباه حقيقي، وكمقياس حسّاس للفرق بين يوم صافي ويوم مشتّت. مش كرافع ذكاء.',
      en:'It is here as genuine attention training and as a sensitive gauge of a clear day versus a scattered one. Not as an intelligence booster.'},
 ref:'Melby-Lervåg & Hulme 2013'},
{t:{ar:'«الذكاءات المتعددة» مش مدعومة تجريبيًا',en:'"Multiple intelligences" lacks empirical support'},

<script>
/* ══════════ بطاقات المراجعة بالتباعد ══════════
   جدول مبسّط على نمط SM-2: كل مراجعة ناجحة بتوسّع الفترة،
   والفشل بيرجّعها لليوم التالي. */

const cards      = () => S.g('cards', []);
const saveCards  = c => S.s('cards', c);
const dueCards   = () => cards().filter(c => c.due <= today());

function addCard(front, back){
  const c = cards();
  c.push({ id:'c'+Date.now()+Math.random().toString(36).slice(2,6),
           front, back, due:today(), ease:2.5, ivl:0, reps:0, lapses:0 });
  saveCards(c);
}
function removeCard(id){ saveCards(cards().filter(c => c.id !== id)); }

/* grade: 0 تاني · 1 صعبة · 2 كويسة · 3 سهلة */
function gradeCard(id, grade){
  const all = cards(); const c = all.find(x => x.id === id);
  if(!c) return;
  c.reps++;
  if(grade === 0){
    c.lapses++; c.ivl = 1; c.ease = Math.max(1.3, c.ease - 0.2);
  } else {
    if(c.ivl === 0)      c.ivl = grade === 1 ? 1 : grade === 2 ? 2 : 4;
    else if(c.ivl === 1) c.ivl = grade === 1 ? 2 : grade === 2 ? 3 : 6;
    else                 c.ivl = Math.round(c.ivl * (grade === 1 ? 1.25 : c.ease));
    if(grade === 1) c.ease = Math.max(1.3, c.ease - 0.15);
    if(grade === 3) c.ease = Math.min(3.0, c.ease + 0.1);
    c.ivl = Math.min(c.ivl, 365);
  }
  const d = new Date(); d.setDate(d.getDate() + c.ivl);
  c.due = d.toISOString().slice(0,10);
  saveCards(all);
  return c.ivl;
}

/* ══════════ توقعاتك الحقيقية ══════════ */
const preds     = () => S.g('preds', []);
const savePreds = p => S.s('preds', p);
const openPreds = () => preds().filter(p => p.result === undefined);
const duePreds  = () => openPreds().filter(p => p.by <= today());
const donePreds = () => preds().filter(p => p.result !== undefined);

function addPred(text, by, conf){
  const p = preds();
  p.push({ id:'p'+Date.now()+Math.random().toString(36).slice(2,6),
           text, by, conf, made:today() });
  savePreds(p);
}
function resolvePred(id, happened){
  const all = preds(); const p = all.find(x => x.id === id);
  if(!p) return;
  p.result = !!happened; p.resolvedOn = today();
  savePreds(all);
}
function removePred(id){ savePreds(preds().filter(p => p.id !== id)); }

/* نتيجة براير: أقل = أدق. ٠ مثالي، ٠٫٢٥ = تخمين عشوائي */
function calibration(){
  const d = donePreds();
  if(d.length < 5) return null;
  const brier = d.reduce((s,p) => s + Math.pow((p.result?1:0) - p.conf, 2), 0) / d.length;
  const acc   = d.filter(p => p.result).length / d.length;
  const conf  = d.reduce((s,p) => s + p.conf, 0) / d.length;
  return { n:d.length, brier, acc, conf, gap: conf - acc,
           score: Math.max(0, Math.round((1 - brier*4) * 100)) };
}
/* منحنى المعايرة: مقارنة الثقة المعلنة بالدقة الفعلية في كل شريحة */
function calibBuckets(){
  const B = [[.5,.65],[.65,.8],[.8,.9],[.9,1.01]];
  return B.map(([lo,hi]) => {
    const g = donePreds().filter(p => p.conf >= lo && p.conf < hi);
    return { lo, hi, n:g.length,
             acc: g.length ? g.filter(p => p.result).length / g.length : null,
             conf: g.length ? g.reduce((s,p)=>s+p.conf,0)/g.length : null };
  });
}

/* ══════════ قصرك ══════════ */
const palace     = () => S.g('palace', []);
const savePalace = p => S.s('palace', p);
function addStation(name){ const p = palace(); p.push(name); savePalace(p); }
function removeStation(i){ const p = palace(); p.splice(i,1); savePalace(p); }
function moveStation(i, dir){
  const p = palace(); const j = i + dir;
  if(j < 0 || j >= p.length) return;
  [p[i], p[j]] = [p[j], p[i]]; savePalace(p);
}

/* ══════════ نسخ احتياطي ══════════ */
function exportData(){
  const out = {};
  try{
    Object.keys(localStorage).filter(k => k.startsWith('mh:'))
      .forEach(k => { out[k.slice(3)] = localStorage.getItem(k); });
  }catch{}
  const blob = new Blob([JSON.stringify({ app:'sage', v:2,
    exported:new Date().toISOString(), data:out }, null, 1)],
    { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sage-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function importData(file, done){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      if(!j || j.app !== 'sage' || !j.data) throw 0;
      Object.keys(localStorage).filter(k => k.startsWith('mh:'))
        .forEach(k => localStorage.removeItem(k));
      Object.entries(j.data).forEach(([k,v]) => localStorage.setItem('mh:'+k, v));
      done(true);
    }catch{ done(false); }
  };
  r.onerror = () => done(false);
  r.readAsText(file);
}
function eraseAll(){
  try{
    Object.keys(localStorage).filter(k => k.startsWith('mh:'))
      .forEach(k => localStorage.removeItem(k));
  }catch{}
}

<script>
/* ═══ الجدولة: بتلزق البنود في الفراغات بين مواعيدك ═══ */

const M = t => { const [h,m] = t.split(':').map(Number); return h*60 + (m||0); };
const T = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const T12 = m => {
  const h = Math.floor(m/60)%24, mm = m%60;
  const ap = isAR() ? (h<12?'ص':'م') : (h<12?'am':'pm'), h12 = h%12 || 12;
  return `${num(h12)}:${num(String(mm).padStart(2,'0'))} ${ap}`;
};

const DAYS_AR = ['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const DAYS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_SHORT_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayName = i => isAR() ? DAYS_AR[i] : DAYS_EN[i];
const dayShort = i => isAR() ? DAYS_AR[i] : DAYS_SHORT_EN[i];

function settings(){
  return S.g('cfg', { wake:'06:30', sleepAt:'23:30', skip:[] });
}

/* الفراغات في اليوم بعد ما نشيل مواعيدك الثابتة */
function freeGaps(dayIdx){
  const c = settings();
  const start = M(c.wake), end = M(c.sleepAt);
  const evs = S.g('events', [])
    .filter(e => !e.days || !e.days.length || e.days.includes(dayIdx))
    .map(e => ({s:M(e.start), e:M(e.end), t:e.title}))
    .filter(e => e.e > start && e.s < end)
    .sort((a,b) => a.s - b.s);

  const gaps = [];
  let cur = start;
  for(const e of evs){
    if(e.s > cur) gaps.push({s:cur, e:Math.min(e.s, end)});
    cur = Math.max(cur, e.e);
  }
  if(cur < end) gaps.push({s:cur, e:end});
  return { gaps: gaps.filter(g => g.e - g.s >= 5), events: evs, start, end };
}

/* بنحط كل بند في أقرب فراغ مناسب لنافذته */
function buildPlan(dayIdx){
  const c = settings();
  const { gaps, events, start, end } = freeGaps(dayIdx);
  const noon = 13*60;
  const free = gaps.map(g => ({...g, cur:g.s}));
  const out = [];

  const windowRange = win => {
    if(win === 'wake')  return [start, start + 150];
    if(win === 'am')    return [start + 30, noon + 120];
    if(win === 'pm')    return [noon, end - 120];
    if(win === 'night') return [end - 110, end];
    return [start, end];
  };

  const place = (b, tag) => {
    const [lo, hi] = windowRange(b.win);
    for(const g of free){
      const from = Math.max(g.cur, lo);
      if(from + b.min <= Math.min(g.e, hi + b.min)){
        out.push({ id:b.id, key:b.id + (tag||''), name:L(b.name) + (tag||''),
                   at:from, min:b.min, how:L(b.how), timer:b.timer, cue:L(b.cue),
                   isDrill:b.isDrill, isCards:b.isCards });
        g.cur = from + b.min + 5;
        return true;
      }
    }
    return false;
  };

  const unplaced = [];
  for(const b of BLOCKS){
    if(c.skip.includes(b.id)) continue;
    if(b.id === 'sleep'){
      out.push({ id:'sleep', key:'sleep', name:L(b.name), at:end - 60, min:0, how:L(b.how) });
      continue;
    }
    const n = b.repeat || 1;
    for(let i=0;i<n;i++){
      const tag = n>1 ? ' '+num(i+1) : '';
      if(!place(b, tag)) unplaced.push(L(b.name) + tag);
    }
  }

  const evItems = events.map(e => ({ id:'__ev', key:'ev'+e.s, name:e.t, at:e.s,
                                     min:e.e - e.s, fixed:true }));
  const items = [...out, ...evItems].sort((a,b) => a.at - b.at);
  items.unplaced = unplaced;
  return items;
}

/* ═══ ملف التقويم: تنبيهات نظام حقيقية ═══ */
function pad(n){ return String(n).padStart(2,'0'); }
function icsDate(d, mins){
  const x = new Date(d);
  x.setHours(Math.floor(mins/60), mins%60, 0, 0);
  return `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
}
function esc(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
/* DTSTAMP لازم UTC. أما DTSTART فسايبينه بتوقيت عائم عن قصد —
   عشان المنبّه يرنّ ٦:٣٠ محلي مهما اتغيّرت المنطقة الزمنية. */
function stampUTC(){
  const d = new Date();
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}`
       + `T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
}

function buildICS(){
  const now = new Date();
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mihakk//AR//','CALSCALE:GREGORIAN',
                 'METHOD:PUBLISH','X-WR-CALNAME:Sage','X-WR-TIMEZONE:'+
                 (Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC')];

  /* بند لكل يوم في الأسبوع، بيتكرر أسبوعيًا */
  const WD = ['SU','MO','TU','WE','TH','FR','SA'];
  for(let d=0; d<7; d++){
    const plan = buildPlan(d).filter(x => !x.fixed && x.min > 0);
    /* أول تاريخ جاي لليوم ده */
    const base = new Date(now);
    base.setDate(base.getDate() + ((d - now.getDay() + 7) % 7));

    for(const item of plan){
      const why = WHY[item.id];
      const uid = `mh-${d}-${item.key}-${Math.random().toString(36).slice(2,8)}@sage`;
      lines.push('BEGIN:VEVENT',
        'UID:'+uid,
        'DTSTAMP:'+stampUTC(),
        'DTSTART:'+icsDate(base, item.at),
        'DTEND:'+icsDate(base, item.at + Math.max(item.min,5)),
        'RRULE:FREQ=WEEKLY;BYDAY='+WD[d],
        'SUMMARY:'+esc(item.name),
        'DESCRIPTION:'+esc((item.how||'') + (why ? '\n\n' + why.does : '')),
        'BEGIN:VALARM','ACTION:DISPLAY',
        'DESCRIPTION:'+esc(item.name),
        'TRIGGER:PT0M','END:VALARM','END:VEVENT');
    }
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function downloadICS(){
  const blob = new Blob([buildICS()], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sage.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ═══ تنبيهات داخل التطبيق وهو مفتوح ═══ */
/* على بعض إصدارات iOS المفتاح موجود والقيمة undefined — فحص أمتن */
function notifState(){
  try{
    if(typeof Notification === 'undefined' || !Notification) return 'unsupported';
    return Notification.permission || 'default';
  }catch{ return 'unsupported'; }
}
let notifTimers = [];
function armNotifications(){
  notifTimers.forEach(clearTimeout); notifTimers = [];
  if(notifState() !== 'granted') return;
  const now = new Date(), nowM = now.getHours()*60 + now.getMinutes();
  buildPlan(now.getDay()).filter(x => !x.fixed && x.at > nowM).forEach(item => {
    const ms = (item.at - nowM) * 60000;
    if(ms > 0 && ms < 14*3600*1000){
      notifTimers.push(setTimeout(()=>{
        try{ new Notification(item.name, { body: item.how || '', tag: item.key }); }catch{}
      }, ms));
    }
  });
}
async function askNotify(){
  const st = notifState();
  if(st === 'unsupported') return st;
  if(st === 'granted'){ armNotifications(); return 'granted'; }
  let r; try{ r = await Notification.requestPermission(); }catch{ return 'unsupported'; }
  if(r === 'granted') armNotifications();
  return r;
}

<script>

let tab='today', openWhy=null;

function log(d,v){ const h=S.g('h:'+d,[]); h.push({d:today(),v}); S.s('h:'+d,h.slice(-300)); mark(d); }
function mark(k){ const x=S.g('done:'+today(),{}); x[k]=true; S.s('done:'+today(),x); }
function unmark(k){ const x=S.g('done:'+today(),{}); delete x[k]; S.s('done:'+today(),x); }

const hist=d=>S.g('h:'+d,[]);

const lastV=d=>{const h=hist(d);return h.length?h[h.length-1].v:null};
function streak(){let n=0;for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);

 plan:'M4 5h16v16H4zM4 9.5h16M9 3v4M15 3v4',

const hd=(eb,ti,le)=>`<div class="hd">${eb?`<div class="eyebrow">${eb}</div>`:''}

/* ══════════ النهاردة ══════════ */
function viewToday(){
  const now=new Date(), nowM=now.getHours()*60+now.getMinutes();
  const plan=buildPlan(now.getDay());
  const live=plan.filter(x=>!x.fixed);
  const doneN=live.filter(x=>isDone(x.key)).length;
  const next=live.find(x=>!isDone(x.key)&&x.at+x.min>=nowM)||live.find(x=>!isDone(x.key));

        <button class="tick ${done?'on':''}" data-k="${x.key}">
          <svg viewBox="0 0 12 12"><path d="M2 6.4l2.6 2.6L10 3.2"/></svg></button></div></div>`}).join('');

  return `<div class="hero">${hd(`${dayName(now.getDay())} · ${num(now.getDate())}`,
      next?next.name:t('all_done'), next?`${T12(next.at)} · ${next.how||''}`:t('all_done_sub'))}
    <div class="gauges">
      <div class="gauge"><b>${num(doneN)}<i>/${num(live.length)}</i></b><span>${t('done_today')}</span></div>
      <div class="gauge"><b>${num(streak())}</b><span>${t('streak')}</span></div>
      <div class="gauge"><b>${best('span')?num(best('span')):'—'}</b><span>${t('best_span')}</span></div>
    </div></div>
    ${nRes?`<div class="notice"><span>${num(nRes)} · ${t('due_resolve')}</span>
      <button data-nav="pred">${t('open')}</button></div>`:''}
    ${plan.unplaced&&plan.unplaced.length?`<div class="notice">
      <span>${t('unplaced')}: ${plan.unplaced.join(' · ')}</span>
      <button data-nav="plan">${t('edit_plan')}</button></div>`:''}
    <div class="rows">${rows}</div>`;
}

/* ══════════ الخطة ══════════ */
function viewPlan(){
  const c=settings(), evs=S.g('events',[]), perm=notifState();
  return hd(null,t('tab_plan'),null)+`
  <h3 class="sec">${t('your_limits')}</h3>

/* ══════════ القياس ══════════ */
function viewGauge(){
  const has=DRILLS.filter(d=>hist(d.id).length>=2);
  const head=hd(null,t('tab_gauge'),null);
  if(!has.length) return head+`<div class="empty">${t('no_data')}</div>`;
  const rows=has.map(d=>{
    const vs=hist(d.id).map(x=>x.v);
    const third=Math.max(1,Math.floor(vs.length/3));
    const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
    const base=avg(vs.slice(0,third)), diff=avg(vs.slice(-third))-base;
    return {d,vs,pct:base?Math.round(diff/base*100):0,cur:vs[vs.length-1]};
  });
  const top=rows.slice().sort((a,b)=>b.vs.length-a.vs.length)[0];
  const mx=Math.max(...top.vs),mn=Math.min(...top.vs),r=(mx-mn)||1,W=560,H=110;
  const pts=top.vs.map((v,i)=>`${(i/Math.max(1,top.vs.length-1))*W},${H-8-((v-mn)/r)*(H-24)}`).join(' ');
  return head+`<div class="bigchart">
      <div class="bch"><b>${L(top.d.name)}</b>
        <span class="chg ${top.pct>0?'up':''}">${top.pct>0?'+':''}${num(top.pct)}${PCT()} ${t('from_start')}</span></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        ${top.vs.map((v,i)=>`<circle cx="${(i/Math.max(1,top.vs.length-1))*W}"
          cy="${H-8-((v-mn)/r)*(H-24)}" r="3.5" fill="var(--gold)"/>`).join('')}</svg>
      <div class="bcf"><div><b>${num(top.cur)}</b><span>${t('current')}</span></div>
        <div><b>${num(top.vs.length)}</b><span>${t('rounds')}</span></div></div></div>
    <div class="table">${rows.map(x=>`<div class="tr"><span class="tn">${L(x.d.name)}</span>
      <span class="tc ${x.pct>0?'up':x.pct<0?'dn':''}">${x.pct>0?'+':''}${num(x.pct)}${PCT()}</span>
      <span class="tv">${num(x.cur)}</span></div>`).join('')}</div>`;
}

/* ══════════ التوقعات ══════════ */
function viewPred(){
  const open=openPreds(), due=duePreds(), done=donePreds(), cal=calibration();
  const dd=new Date(); dd.setMonth(dd.getMonth()+1);
  let calBlock='';
  if(cal){
    const cls=Math.abs(cal.gap)<0.08?'ok':'no';
    const label=cal.gap>0.12?t('calib_over'):cal.gap<-0.12?t('calib_under'):t('calib_good');
    calBlock=`<div class="bigchart">
      <div class="bch"><b>${t('your_calib')}</b><span class="chg ${cls}">${label}</span></div>
      <div class="calbars">${calibBuckets().map(b=>{
        const lab=num(Math.round(b.lo*100))+'–'+num(Math.round(Math.min(b.hi,1)*100));
        if(!b.n) return `<div class="cb"><i class="none2"></i><span>${lab}</span></div>`;
        return `<div class="cb"><i class="conf" style="height:${Math.round(b.conf*100)}%"></i>
          <i class="acc" style="height:${Math.round(b.acc*100)}%"></i><span>${lab}</span></div>`}).join('')}</div>
      <div class="callegend"><span class="k1">${t('avg_conf')}</span><span class="k2">${t('accuracy')}</span></div>
      <div class="bcf"><div><b>${num(cal.score)}</b><span>${t('your_calib')}</span></div>
        <div><b>${num(Math.round(cal.acc*100))}${PCT()}</b><span>${t('accuracy')}</span></div>
        <div><b>${num(Math.round(cal.conf*100))}${PCT()}</b><span>${t('avg_conf')}</span></div></div></div>`;
  } else if(done.length) calBlock=`<div class="empty">${t('need_more')} — ${num(done.length)}/${num(5)}</div>`;

  return hd(null,t('pred_title'),t('pred_lede'))+calBlock+`
    ${due.length?`<h3 class="sec">${t('due_resolve')}</h3>
      ${due.map(p=>`<div class="pr due"><div><b>${p.text}</b>
        <span>${num(Math.round(p.conf*100))}${PCT()} · ${p.by}</span></div>
        <div class="pra"><button class="yes" data-res="${p.id}|1">${t('happened')}</button>
        <button class="no2" data-res="${p.id}|0">${t('didnt')}</button></div></div>`).join('')}`:''}
    <h3 class="sec">${t('add_pred')}</h3>
    <div class="addbox"><input id="pt" placeholder="${t('pred_ph')}">
      <label class="inl">${t('pred_by')}<input type="date" id="pby" value="${dd.toISOString().slice(0,10)}"></label>
      <div class="conf pick">${[50,60,70,80,90,95].map(c=>
        `<button data-pc="${c}" class="${c===70?'on':''}">${num(c)}${PCT()}</button>`).join('')}</div>
      <button class="pri wide" id="padd">${t('add_pred')}</button></div>
    ${open.filter(p=>p.by>today()).length?`<h3 class="sec">${t('open_preds')}</h3>
      ${open.filter(p=>p.by>today()).map(p=>`<div class="pr"><div><b>${p.text}</b>
        <span>${num(Math.round(p.conf*100))}${PCT()} · ${p.by}</span></div>
        <button class="del" data-pdel="${p.id}">${t('remove')}</button></div>`).join('')}`:''}
    ${done.length?`<h3 class="sec">${t('resolved')}</h3>
      ${done.slice(-12).reverse().map(p=>`<div class="pr res ${p.result?'hit':'miss'}">
        <div><b>${p.text}</b><span>${num(Math.round(p.conf*100))}${PCT()} · ${p.result?t('happened'):t('didnt')}</span></div>
        </div>`).join('')}`:(!open.length?`<div class="empty">${t('no_preds')}</div>`:'')}`;
}
