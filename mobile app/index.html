/* ══════════ الرسم والربط ══════════ */
function render(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=isAR()?'rtl':'ltr';
  document.getElementById('main').innerHTML=({today:viewToday,plan:viewPlan,drills:viewDrills,
    gauge:viewGauge,cards:viewCards,pred:viewPred,palace:viewPalace,curric:viewCurric,
    limits:viewLimits,data:viewData,more:viewMore})[tab]();
  wire();
}
function wire(){
  const R=render;
  document.querySelectorAll('[data-why]').forEach(b=>b.onclick=()=>{
    openWhy=openWhy===b.dataset.why?null:b.dataset.why;R()});
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
    isDone(b.dataset.k)?unmark(b.dataset.k):mark(b.dataset.k);R()});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>start(b.dataset.go));
  document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{
    const [id,key]=b.dataset.timer.split('|');runTimer(id,key)});
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
    LANG=b.dataset.lang;S.s('lang',LANG);nav();R()});

  ['wake','sleepAt'].forEach(k=>{const el=document.getElementById(k);
    if(el) el.onchange=()=>{const c=settings();c[k]=el.value;S.s('cfg',c);armNotifications();R()}});
  let picked=[];
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    const d=+b.dataset.day;picked.includes(d)?picked=picked.filter(x=>x!==d):picked.push(d);
    b.classList.toggle('on')});
  const add=document.getElementById('ev-add');
  if(add) add.onclick=()=>{
    const ti=document.getElementById('ev-t').value.trim();
    const s=document.getElementById('ev-s').value,e=document.getElementById('ev-e').value;
    if(!ti) return document.getElementById('ev-t').focus();
    if(M(e)<=M(s)) return;
    const evs=S.g('events',[]);evs.push({title:ti,start:s,end:e,days:picked.length?picked:[0,1,2,3,4,5,6]});
    S.s('events',evs);armNotifications();R()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const evs=S.g('events',[]);evs.splice(+b.dataset.del,1);S.s('events',evs);armNotifications();R()});
  document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{
    const c=settings(),id=b.dataset.skip;
    c.skip=c.skip.includes(id)?c.skip.filter(x=>x!==id):[...c.skip,id];
    S.s('cfg',c);armNotifications();R()});
  const ics=document.getElementById('ics'); if(ics) ics.onclick=downloadICS;
  const nb=document.getElementById('notif'); if(nb) nb.onclick=async()=>{await askNotify();R()};

  const cadd=document.getElementById('cadd');
  if(cadd) cadd.onclick=()=>{
    const f=document.getElementById('cf').value.trim(),b=document.getElementById('cb').value.trim();
    if(!f||!b) return document.getElementById(f?'cb':'cf').focus();
    addCard(f,b);R()};
  document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{removeCard(b.dataset.cdel);R()});
  const sg=document.getElementById('srs-go'); if(sg) sg.onclick=runSRS;

  let pc=0.7;
  document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{pc=+b.dataset.pc/100;
    document.querySelectorAll('[data-pc]').forEach(x=>x.classList.toggle('on',x===b))});
  const padd=document.getElementById('padd');
  if(padd) padd.onclick=()=>{
    const tx=document.getElementById('pt').value.trim(),by=document.getElementById('pby').value;
    if(!tx) return document.getElementById('pt').focus();
    addPred(tx,by,pc);R()};
  document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{
    const [id,v]=b.dataset.res.split('|');resolvePred(id,v==='1');R()});
  document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{removePred(b.dataset.pdel);R()});

  const stadd=document.getElementById('stadd');
  if(stadd) stadd.onclick=()=>{const v=document.getElementById('stn').value.trim();
    if(!v) return document.getElementById('stn').focus(); addStation(v);R()};
  document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{removeStation(+b.dataset.sdel);R()});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    const [i,d]=b.dataset.mv.split('|');moveStation(+i,+d);R()});

  const ex=document.getElementById('exp'); if(ex) ex.onclick=exportData;
  const im=document.getElementById('imp');
  if(im) im.onchange=()=>{ if(!im.files[0])return;
    if(!confirm(t('import_warn'))){im.value='';return}
    importData(im.files[0],ok=>{const m=document.getElementById('impmsg');
      if(m){m.textContent=ok?t('import_ok'):t('import_bad');m.className='impmsg '+(ok?'ok':'no')}
      if(ok){LANG=detectLang();setTimeout(()=>{nav();R()},600)}})};
  const er=document.getElementById('erase');
  if(er) er.onclick=()=>{if(confirm(t('erase_warn'))){eraseAll();LANG=detectLang();nav();R()}};
}

/* ══════════ المشهد ══════════ */
const stage=document.getElementById('stage'), sBody=document.getElementById('s-body');
function openStage(n,l){document.getElementById('s-name').textContent=n;
  document.getElementById('s-lvl').textContent=l||'';stage.classList.add('open');
  document.body.style.overflow='hidden'}
const setLvl=x=>document.getElementById('s-lvl').textContent=x;
function close(){stage.classList.remove('open');sBody.innerHTML='';clearTimeout(window._t);
  document.body.style.overflow='';render()}
document.getElementById('s-close').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('open'))close()});
const acts=(...b)=>`<div class="acts">${b.join('')}</div>`;

function runTimer(id,key){
  const b=BLOCKS.find(x=>x.id===id); if(!b||!b.timer) return;
  openStage(L(b.name),''); let left=b.timer;
  const draw=()=>{const m=Math.floor(left/60),s=left%60;
    sBody.innerHTML=`<div class="cue">${L(b.cue)||L(b.how)}</div>
      <div class="big">${num(String(m).padStart(2,'0'))}:${num(String(s).padStart(2,'0'))}</div>
      ${acts(`<button id="stop">${t('finish')}</button>`)}`;
    document.getElementById('stop').onclick=close};
  draw();
  const tk=()=>{left--;
    if(left<=0){mark(key);sBody.innerHTML=`<div class="big gold">✓</div>
      ${acts(`<button class="pri" id="d">${t('finish')}</button>`)}`;
      document.getElementById('d').onclick=close;return}
    draw();window._t=setTimeout(tk,1000)};
  window._t=setTimeout(tk,1000);
}
function start(id){const d=DRILLS.find(x=>x.id===id);openStage(L(d.name),'');
  ({span:runSpan,palace:runPalace,calib:runCalib,nback:runNback,stroop:runStroop,sense:runSense})[id]()}

function runSRS(){
  const q=dueCards(); if(!q.length) return;
  openStage(t('cards_title'),''); let i=0;
  const show=()=>{
    if(i>=q.length){sBody.innerHTML=`<div class="big gold">✓</div>
      <div class="cue">${t('no_due')}</div>${acts(`<button class="pri" id="d">${t('finish')}</button>`)}`;
      document.getElementById('d').onclick=close;return}
    const c=q[i]; setLvl(num(i+1)+' '+t('of')+' '+num(q.length));
    sBody.innerHTML=`<div class="cue">${t('card_front')}</div><div class="big sm">${c.front}</div>
      ${acts(`<button class="pri" id="flip">${t('show_answer')}</button>`)}`;
    document.getElementById('flip').onclick=()=>{
      sBody.innerHTML=`<div class="cue">${c.front}</div><div class="big sm gold">${c.back}</div>
        <div class="grades">${[[0,'again'],[1,'hard'],[2,'good'],[3,'easy']].map(([g,k])=>
          `<button data-g="${g}" class="g${g}">${t(k)}</button>`).join('')}</div>`;
      sBody.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
        gradeCard(c.id,+b.dataset.g);mark('cards');i++;show()})}};
  show();
}

function runSpan(){
  let n=4,misses=0,peak=0;
  const round=()=>{
    const seq=Array.from({length:n},()=>rnd(10));
    setLvl(num(n)+' '+L({ar:'أرقام',en:'digits'}));
    sBody.innerHTML=`<div class="cue">${L({ar:'ركّز. الأرقام هتظهر واحد واحد.',en:'Watch. Digits appear one at a time.'})}</div>
      <div class="big" id="x"></div><div class="progress"><i id="pg"></i></div>`;
    let i=0;
    const show=()=>{const el=document.getElementById('x');if(!el)return;
      if(i<seq.length){el.textContent=num(seq[i]);
        const pg=document.getElementById('pg');if(pg)pg.style.width=((i+1)/seq.length*100)+'%';
        i++;window._t=setTimeout(()=>{el.textContent='';window._t=setTimeout(show,220)},780)}
      else ask(seq)};
    window._t=setTimeout(show,900)};
  const ask=seq=>{
    let val='';
    sBody.innerHTML=`<div class="cue">${L({ar:'اكتب الأرقام بالترتيب.',en:'Enter the digits in order.'})}</div>
      <div class="big sm gold" id="val">&nbsp;</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-n="${k}">${num(k)}</button>`).join('')}
        <button data-n="back" class="alt">⌫</button><button data-n="0">${num(0)}</button>
        <button data-n="ok" class="alt ok2">✓</button></div>`;
    sBody.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.n;
      if(k==='ok'){ if(val===seq.join('')){peak=Math.max(peak,n);n++;misses=0;done(true,seq)}
        else{misses++;done(false,seq)} return; }
      if(k==='back') val=val.slice(0,-1);
      else if(val.length<seq.length+2) val+=k;
      document.getElementById('val').innerHTML=val?num(val):'&nbsp;'})};
  const done=(ok,seq)=>{
    sBody.innerHTML=`<div class="big sm">${seq.map(num).join(' ')}</div>
      <div class="verdict ${ok?'ok':'no'}">${ok?t('correct'):t('wrong')}</div>
      ${misses>=2?`<div class="cue" style="margin-top:1.2rem">${L({ar:'وقفنا عند',en:'Stopped at'})}
        <b class="gold">${num(peak||1)}</b>. ${peak>=9?
        L({ar:'فوق المتوسط. النظام الكبير بيعدّي الحاجز ده.',en:'Above average. The major system breaks this ceiling.'}):
        L({ar:'المتوسط ٧ — والترميز هو اللي بيعدّيه.',en:'Average is 7 — encoding is what beats it.'})}</div>`
        +acts(`<button class="pri" id="f">${t('save_result')}</button>`)
        :acts(`<button class="pri" id="n">${t('cont')}</button>`)}`;
    if(misses>=2) document.getElementById('f').onclick=()=>{log('span',peak||1);mark('drills');close()};
    else document.getElementById('n').onclick=round};
  round();
}

function runPalace(){
  const st=palace(), useMine=st.length>=5;
  const N=Math.min(10, useMine?st.length:10);
  const words=shuffle(L(PWORDS)).slice(0,N);
  sBody.innerHTML=`<div class="cue">${L({ar:'هتشوف',en:'You will see'})} ${num(N)} ${
    L({ar:'كلمات لمدة دقيقة.',en:'items for one minute.'})}<br>${useMine?
    L({ar:'حطّ كل واحدة في محطة من قصرك، بالترتيب.',en:'Place each at a station in your palace, in order.'}):
    L({ar:'حطّ كل واحدة في محطة من مكان تعرفه، بصورة مبالغة ومتحركة.',en:'Place each at a station in a place you know, as an exaggerated moving image.'})}</div>
    ${acts(`<button class="pri" id="go">${t('start')}</button>`)}`;
  document.getElementById('go').onclick=()=>{
    let left=60;
    const tk=()=>{const el=document.getElementById('tt');if(!el)return;
      el.textContent=num(left);if(left--<=0)return recall();window._t=setTimeout(tk,1000)};
    sBody.innerHTML=`<div class="cue"><span id="tt">${num(60)}</span></div>
      <div class="pairs">${words.map((w,i)=>`<div class="pair"><span class="pi">${num(i+1)}</span>
        ${useMine?`<span class="ps">${st[i]}</span>`:''}<b>${w}</b></div>`).join('')}</div>
      ${acts(`<button id="e">${t('cont')}</button>`)}`;
    document.getElementById('e').onclick=()=>{clearTimeout(window._t);recall()};
    tk()};
  const recall=()=>{clearTimeout(window._t);setLvl(num(N));
    sBody.innerHTML=`<div class="cue">${L({ar:'اكتب اللي فاكره — كلمة وادوس Enter.',en:'Type what you remember — one per Enter.'})}</div>
      <input class="entry" id="in" autocomplete="off" placeholder="…">
      <div class="got" id="got"></div>${acts(`<button class="pri" id="d">${t('confirm')}</button>`)}`;
    const inp=document.getElementById('in');inp.focus();const got=[];
    inp.onkeydown=e=>{if(e.key!=='Enter')return;const v=inp.value.trim();
      if(v&&!got.includes(v)){got.push(v);document.getElementById('got').textContent=got.join(' · ')}
      inp.value=''};
    document.getElementById('d').onclick=()=>{
      const hit=got.filter(w=>words.includes(w)),miss=words.filter(w=>!got.includes(w));
      sBody.innerHTML=`<div class="big">${num(hit.length)}<i>/${num(N)}</i></div>
        <div class="verdict ${hit.length>=N*0.7?'ok':''}">${hit.length>=N*0.9?
          L({ar:'ممتاز.',en:'Excellent.'}):hit.length>=N*0.6?
          L({ar:'كويس. النقص بيبقى في المحطات المتشابهة — خلّيها مميزة.',en:'Good. Losses cluster at similar stations — make them distinct.'}):
          L({ar:'الطبيعي من غير طريقة ٥ إلى ٧.',en:'Without a method, 5 to 7 is normal.'})}</div>
        ${miss.length?`<div class="cue" style="margin-top:.9rem">${miss.join(' · ')}</div>`:''}
        ${acts(`<button class="pri" id="f">${t('save_result')}</button>`)}`;
      document.getElementById('f').onclick=()=>{log('palace',hit.length);mark('drills');close()}}};
}

function runCalib(){
  const qs=shuffle(CALQ).slice(0,10);let i=0;const recs=[];
  const step=()=>{if(i>=qs.length)return fin();
    const q=qs[i];setLvl(num(i+1)+' '+t('of')+' '+num(10));
    sBody.innerHTML=`<div class="cue">${L({ar:'صح ولا غلط؟',en:'True or false?'})}</div>
      <div class="big sm">${L(q.q)}</div>
      <div class="opts two2"><button data-a="1">${L({ar:'صح',en:'True'})}</button>
        <button data-a="0">${L({ar:'غلط',en:'False'})}</button></div>`;
    sBody.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>conf(q,b.dataset.a==='1'))};
  const conf=(q,ans)=>{
    sBody.innerHTML=`<div class="cue">${t('pred_conf')}<br><span class="sm2">${
      L({ar:'دي أهم خطوة — مش الإجابة، الثقة.',en:'This is the step that matters — not the answer, the confidence.'})}</span></div>
      <div class="conf">${[50,60,70,80,90,95,99].map(c=>`<button data-c="${c}">${num(c)}${PCT()}</button>`).join('')}</div>`;
    sBody.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      const c=+b.dataset.c/100,ok=ans===q.a;recs.push({c,ok});
      sBody.innerHTML=`<div class="verdict ${ok?'ok':'no'}">${ok?t('correct'):t('wrong')}</div>
        <div class="cue" style="margin-top:.8rem">${L(q.n)}</div>
        ${acts(`<button class="pri" id="n">${t('next')}</button>`)}`;
      document.getElementById('n').onclick=()=>{i++;step()}})};
  const fin=()=>{
    const brier=recs.reduce((s,r)=>s+Math.pow((r.ok?1:0)-r.c,2),0)/recs.length;
    const score=Math.max(0,Math.round((1-brier*4)*100));
    const acc=recs.filter(r=>r.ok).length/recs.length;
    const mc=recs.reduce((s,r)=>s+r.c,0)/recs.length,gap=mc-acc;
    setLvl('');
    sBody.innerHTML=`<div class="big">${num(score)}</div>
      <div class="cue" style="margin-top:.8rem">${t('accuracy')} <b class="gold">${num(Math.round(acc*100))}${PCT()}</b> ·
        ${t('avg_conf')} <b class="gold">${num(Math.round(mc*100))}${PCT()}</b></div>
      <div class="verdict ${Math.abs(gap)<0.08?'ok':'no'}">${gap>0.12?t('calib_over'):gap<-0.12?t('calib_under'):t('calib_good')}</div>
      <div class="cue" style="margin-top:1rem;font-size:.85rem">${
        L({ar:'دي أسئلة إحماء. المهارة الحقيقية في «توقعاتك».',en:'Warm-up questions. The real skill lives in Forecasts.'})}</div>
      ${acts(`<button class="pri" id="f">${t('save_result')}</button>`,`<button id="topred">${t('pred_title')}</button>`)}`;
    document.getElementById('f').onclick=()=>{log('calib',score);mark('drills');close()};
    document.getElementById('topred').onclick=()=>{log('calib',score);mark('drills');close();go('pred')}};
  step();
}

function runNback(){
  const N=2,LEN=22,seq=Array.from({length:LEN},()=>rnd(9));
  let i=0,hits=0,fa=0,tg=0,ans=false;
  sBody.innerHTML=`<div class="cue">${L({ar:'مربّع هيضيء كل خطوة. دوس «تكرار» لو الموقع ده نفس الموقع من خطوتين فاتوا.',
    en:'A square lights each step. Press Repeat when the position matches two steps back.'})}</div>
    ${acts(`<button class="pri" id="go">${t('start')}</button>`)}`;
  document.getElementById('go').onclick=()=>{
    sBody.innerHTML=`<div class="cue" id="c">—</div>
      <div class="grid3">${Array.from({length:9},(_,k)=>`<i data-k="${k}"></i>`).join('')}</div>
      ${acts(`<button class="pri" id="rep">${L({ar:'تكرار',en:'Repeat'})}</button>`)}
      <div class="progress"><i id="pg"></i></div>`;
    document.getElementById('rep').onclick=()=>{if(ans||i<=N)return;ans=true;
      const hit=seq[i-1]===seq[i-1-N];
      if(hit){hits++;document.getElementById('c').textContent=t('correct')}
      else{fa++;document.getElementById('c').textContent=t('wrong')}};
    const step=()=>{if(i>=LEN)return fin();
      document.querySelectorAll('.grid3 i').forEach(e=>e.classList.remove('lit'));
      document.querySelector(`.grid3 i[data-k="${seq[i]}"]`).classList.add('lit');
      if(i>=N&&seq[i]===seq[i-N])tg++;
      i++;ans=false;
      const c=document.getElementById('c');if(c&&i>1)c.textContent='—';
      document.getElementById('pg').style.width=(i/LEN*100)+'%';
      setLvl(num(i)+' / '+num(LEN));window._t=setTimeout(step,2100)};
    step()};
  const fin=()=>{const acc=tg?Math.round(hits/tg*100):0;setLvl('');
    sBody.innerHTML=`<div class="big">${num(acc)}${PCT()}</div>
      <div class="cue" style="margin-top:.8rem">${num(hits)}/${num(tg)} · ${num(fa)} ${L({ar:'إنذار كاذب',en:'false alarms'})}</div>
      ${acts(`<button class="pri" id="f">${t('save_result')}</button>`)}`;
    document.getElementById('f').onclick=()=>{log('nback',acc);mark('drills');close()}};
}

function runStroop(){
  const C=[[{ar:'أحمر',en:'Red'},'#C0574A'],[{ar:'أخضر',en:'Green'},'#6E9478'],
           [{ar:'أزرق',en:'Blue'},'#5B8FC0'],[{ar:'أصفر',en:'Yellow'},'#D8B36A']];
  const LEN=20;let i=0,ok=0;
  const step=()=>{if(i>=LEN)return fin();
    setLvl(num(i+1)+' / '+num(LEN));
    const w=rnd(4);let c=rnd(4);if(Math.random()<0.7&&c===w)c=(c+1+rnd(3))%4;
    sBody.innerHTML=`<div class="cue">${L({ar:'قول لون الحروف، مش الكلمة.',en:'Name the ink colour, not the word.'})}</div>
      <div class="big" style="color:${C[c][1]}">${L(C[w][0])}</div>
      <div class="opts four">${C.map((x,k)=>`<button data-c="${k}">${L(x[0])}</button>`).join('')}</div>`;
    sBody.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(+b.dataset.c===c)ok++;i++;step()})};
  const fin=()=>{const p=Math.round(ok/LEN*100);setLvl('');
    sBody.innerHTML=`<div class="big">${num(p)}${PCT()}</div>
      <div class="verdict ${p>=85?'ok':''}">${p>=90?L({ar:'كبح قوي.',en:'Strong inhibition.'}):
        p>=70?L({ar:'متوسط. بيتحسّن بالتكرار على أسابيع.',en:'Mid. It improves over weeks.'}):
        L({ar:'الكلمة بتغلب اللون — ده طبيعي في البداية.',en:'The word is winning — normal at first.'})}</div>
      ${acts(`<button class="pri" id="f">${t('save_result')}</button>`)}`;
    document.getElementById('f').onclick=()=>{log('stroop',p);mark('drills');close()}};
  step();
}

function runSense(){
  let diff=26,lvl=0,miss=0;
  const round=()=>{setLvl(t('level')+' '+num(lvl+1));
    const base=rnd(360),Lb=52,lighter=rnd(2);
    const cols=lighter?[`hsl(${base} 30% ${Lb}%)`,`hsl(${base} 30% ${Lb+diff/10}%)`]
                      :[`hsl(${base} 30% ${Lb+diff/10}%)`,`hsl(${base} 30% ${Lb}%)`];
    sBody.innerHTML=`<div class="cue">${L({ar:'أنهي مربّع أفتح؟',en:'Which square is lighter?'})}<br>
      <span class="sm2">${L({ar:'قارنهم جنب بعض — المقارنة أسهل من الحكم المنفرد، وده مقصود.',
        en:'Compare side by side — comparison beats isolated judgement, and that is deliberate.'})}</span></div>
      <div class="swatches"><button data-i="0" style="background:${cols[0]}"></button>
        <button data-i="1" style="background:${cols[1]}"></button></div>`;
    sBody.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      const right=(+b.dataset.i===0)===(lighter===1);
      if(right){lvl++;diff=Math.max(2,diff*0.78);miss=0;round()}
      else{miss++;diff=Math.min(40,diff*1.35);
        if(miss>=3)return fin();
        sBody.innerHTML=`<div class="verdict no">${t('wrong')}</div>
          ${acts(`<button class="pri" id="n">${t('cont')}</button>`)}`;
        document.getElementById('n').onclick=round}})};
  const fin=()=>{setLvl('');
    sBody.innerHTML=`<div class="big">${num(lvl)}</div>
      <div class="verdict ${lvl>=8?'ok':''}">${lvl>=10?
        L({ar:'تمييز عالي. بينتقل لشغلك المرئي مباشرة.',en:'High acuity. This carries into visual work.'}):
        L({ar:'التعلّم الإدراكي بيبان بعد أسابيع من التعرّض بارتجاع.',en:'Perceptual learning shows after weeks of exposure with feedback.'})}</div>
      ${acts(`<button class="pri" id="f">${t('save_result')}</button>`)}`;
    document.getElementById('f').onclick=()=>{log('sense',lvl);mark('drills');close()}};
  round();
}
